# Keeps the packaged glitch-soc version in sync with upstream.
#
# Two ways in, both ending in a real `nix build`:
#
#   cron / manual   follow the latest upstream tag, open a pull request
#   push            you bumped `version` in flake.nix yourself: regenerate
#                   gemset.nix, yarn-missing-hashes.json and the hashes, and
#                   commit them back onto the same branch
#
# Setup:
#   * repo secret `forgejo_token`: Codeberg token with read/write on this repo
#   * cron "glitch-soc-update" on main, e.g. "0 4 * * *" (daily 04:00, server
#     timezone — 5 fields: min hour dom month dow)
#
# Runs on brok's local-backend agent: the steps are plain shell commands on
# that host, so they use its own warm /nix/store and talk to its nix-daemon.
# There is no image to pull and nothing to mount, which is what the k3s setup
# needed ci/nix-store.yaml to arrange -- that file is now moot, kept only as
# the fallback shape if this ever moves back into the cluster.
#
# The tools the Makefile and update.sh reach for (nix, make, git, curl, sed,
# awk, grep, tar) come from the agent's own PATH, set in nix-servers at
# install-specific/brok/woodpecker-agent.nix. Adding a new one to a step means
# adding it there too -- there is no image to put it in.

when:
  - event: [cron, manual]
  - event: push
    path: flake.nix

# `backend` and `location` are how the two agents on brok are told apart:
# location=brok is a custom label both of them set, backend=local is built in
# and unique to the one that runs steps on the host itself.
labels:
  location: brok
  backend: local

steps:
  - name: update
    commands:
      - . ci/nix-env.sh
      - |
        if [ "$CI_COMMIT_AUTHOR" = "woodpecker" ]; then
          echo "own commit, skipping"
          touch .ci-skip
        elif [ "$CI_PIPELINE_EVENT" = "push" ]; then
          make refresh
        elif make outdated; then
          make update
        else
          echo "already on $(make --no-print-directory current), nothing to do"
          touch .ci-skip
        fi
      - git --no-pager diff --stat

  - name: build
    commands:
      - . ci/nix-env.sh
      - test ! -f .ci-skip || exit 0
      - make build

  - name: publish
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - . ci/nix-env.sh
      - test ! -f .ci-skip || exit 0
      - |
        if [ "$CI_PIPELINE_EVENT" = "push" ]; then
          make push BRANCH="$CI_COMMIT_BRANCH"
        else
          make pr
        fi
