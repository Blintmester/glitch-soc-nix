# Keeps the packaged glitch-soc version in sync with upstream.
#
# Two ways in, both ending in a real `nix build`:
#
#   cron / manual   follow the latest upstream tag, open a pull request
#   push            you bumped `version` in flake.nix yourself: regenerate
#                   gemset.nix, yarn-missing-hashes.json and the hashes, and
#                   commit them back onto the same branch
#
# Setup:
#   * repo secret `forgejo_token`: Codeberg token with read/write on this repo
#   * cron "glitch-soc-update" on main, e.g. "0 4 * * *" (daily 04:00, server
#     timezone — 5 fields: min hour dom month dow)
#
# The pods bring their own nix, so nothing has to be mounted from the node.
# The price is a cold store on every run: the gems and the asset build are
# redone each time, and only what cache.nixos.org already has is fetched.
# ci/nix-store.yaml describes the faster variant if that becomes a problem.

when:
  - event: [cron, manual]
  - event: push
    path: flake.nix

variables:
  - &image nixos/nix:2.32.4
  - &resources
    kubernetes:
      resources:
        requests:
          memory: 2Gi
          cpu: 1000m
        limits:
          memory: 12Gi
          cpu: 8000m

steps:
  - name: update
    image: *image
    backend_options: *resources
    commands:
      - . ci/nix-env.sh
      - |
        if [ "$CI_COMMIT_AUTHOR" = "woodpecker" ]; then
          echo "own commit, skipping"
          touch .ci-skip
        elif [ "$CI_PIPELINE_EVENT" = "push" ]; then
          make refresh
        elif make outdated; then
          make update
        else
          echo "already on $(make --no-print-directory current), nothing to do"
          touch .ci-skip
        fi
      - git --no-pager diff --stat

  - name: build
    image: *image
    backend_options: *resources
    commands:
      - . ci/nix-env.sh
      - test ! -f .ci-skip || exit 0
      - make build

  - name: publish
    image: *image
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - . ci/nix-env.sh
      - test ! -f .ci-skip || exit 0
      - |
        if [ "$CI_PIPELINE_EVENT" = "push" ]; then
          make push BRANCH="$CI_COMMIT_BRANCH"
        else
          make pr
        fi
