# OPTIONAL, and not what .woodpecker/update.yaml currently does.
#
# The pipeline ships its own nix (image nixos/nix), which means a cold store on
# every run. This manifest is the alternative: hand the pipeline pods the k3s
# node's /nix, so they reuse the NixOS host's store and its nix-daemon and only
# build what actually changed.
#
#   kubectl apply -f ci/nix-store.yaml
#
# Switching to it means, in .woodpecker/update.yaml:
#
#   * image: a bare one (alpine) with `apk add --no-cache make git curl bash`
#     as the first command — mounting over /nix would hide the nix image's own
#     store, including its shell, and the container would not start
#   * backend_options.kubernetes.volumes: - name: nix-store / path: /nix
#   * the repo marked trusted in Woodpecker, or the volume is silently dropped
#
# ci/nix-env.sh already handles both shapes and needs no change.
#
# Adjust `namespace` to wherever the Woodpecker agent creates pipeline pods
# (WOODPECKER_BACKEND_K8S_NAMESPACE) and `nodeAffinity` to the node that runs
# them. With more than one node, pin the pipeline to this node — a hostPath
# volume is only meaningful there.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nix-store
spec:
  capacity:
    storage: 100Gi # not enforced for hostPath, the node's disk is the limit
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /nix
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - CHANGE-ME # the NixOS node running the agent
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nix-store
  namespace: woodpecker
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: nix-store
  resources:
    requests:
      storage: 100Gi
